<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDS Admin Girişi</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #ffffff; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #000000;
        }
        
        .login-card {
            max-width: 400px;
            width: 90%;
            padding: 40px;
            border-radius: 20px;
            background-color: #ffffff;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid #eeeeee;
        }

        .text-header {
            color: #000000;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .form-label {
            color: #333333;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-control {
            background-color: #fcfcfc;
            border: 2px solid #eeeeee;
            color: #000000;
            border-radius: 10px;
            padding: 12px;
            transition: 0.3s;
        }

        .form-control:focus {
            background-color: #ffffff;
            border-color: #17adbb;
            color: #000000;
            box-shadow: none;
        }

        .btn-login {
            background-color: #17adbb;
            color: #ffffff;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            padding: 14px;
            margin-top: 20px;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-login:hover {
            background-color: #138d99;
            transform: translateY(-2px);
            color: #ffffff;
            box-shadow: 0 5px 15px rgba(23, 173, 187, 0.3);
        }

        .footer-text {
            color: #999999;
            font-size: 0.8rem;
            margin-top: 25px;
        }

        /* Hata mesajı stili */
        #errorMessage {
            background-color: #fff5f5;
            color: #c53030;
            border: 1px solid #feb2b2;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-top: 15px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card login-card">
        <div class="card-body p-0">
            <div class="text-center mb-4">
                <h2 class="text-header">GYM KDS</h2>
                <p class="text-muted small">Yönetici Paneli Erişimi</p>
            </div>

            <form id="loginForm">
                
                <div class="mb-3">
                    <label for="username" class="form-label">Kullanıcı Adı</label>
                    <input type="text" 
                           class="form-control" 
                           id="username" 
                           placeholder="Kullanıcı adınızı girin"
                           required 
                           value="admin"> 
                </div>
                
                <div class="mb-2">
                    <label for="password" class="form-label">Şifre</label>
                    <input type="password" 
                           class="form-control" 
                           id="password" 
                           placeholder="••••••••"
                           required
                           value="123456"> 
                </div>

                <div id="errorMessage"></div>
                
                <button type="submit" class="btn btn-login w-100">Giriş Yap</button>
            </form>

            <div class="text-center footer-text">
                &copy; 2025 Fitness KDS. Tüm hakları saklıdır.
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
   <script src="js/login.js"></script>
</body>
</html>
